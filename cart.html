<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cart | ALFA SYSTEMS</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://kit.fontawesome.com/ccc999b0a6.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="alfa.css" />
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="responsive.css" />
    <link rel="stylesheet" href="site.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Poppins:wght@800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div class="main-content">

      <nav class="navbar navbar-green">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-controls="sidebar"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <a class="navbar-brand" href="alfa.html">
          <img src="https://res.cloudinary.com/ddng8ksv6/image/upload/v1791894089/image-removebg-preview_mbsics.png" alt="ALFA SYSTEMS" />
        </a>
        <span class="nav-title">My Cart</span>
        <div class="nav-links"><a href="alfa.html">Home</a><a href="products.html">Products</a><a href="services.html">Services</a><a href="orders.html">Orders</a></div>
        <div class="yt-search"><input class="search" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off" /><button class="search-icon" type="button" aria-label="Search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button></div>
        <a href="cart.html" class="cart-link" aria-label="Cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-text">Cart</span>
          <span class="cart-count" id="cartCount" hidden>0</span>
        </a>
      </nav>

      <main class="page-wrap cart-page">
        <div class="cart-layout">
          <section class="cart-main" aria-label="Shopping cart">
            <header class="cart-page-head">
              <div>
                <p class="cart-kicker">ALFA SYSTEMS <span aria-hidden="true">/</span> YOUR SELECTION</p>
                <h1 class="page-heading">My Cart</h1>
                <p class="cart-intro">Review your selected products and send your enquiry to our team.</p>
              </div>
              <p class="cart-items-count" id="cartItemsCount" aria-live="polite"></p>
            </header>
            <section id="cartList" class="cart-list" aria-label="Products in your cart" aria-live="polite"></section>
          </section>
          <aside id="cartSummary" class="cart-summary-panel" aria-label="Cart summary" aria-live="polite"></aside>
        </div>
      </main>

    </div>

    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <img src="https://res.cloudinary.com/ddng8ksv6/image/upload/v1791894089/image-removebg-preview_mbsics.png" alt="Logo" class="img-fluid" />
      </div>
      <nav>
        <a href="alfa.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">My Cart</a>
        <a href="orders.html">My Orders</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
      </nav>
    </aside>

    <script src="products.js"></script>
    <script src="api.js"></script>
    <script src="alfa.js"></script>
    <script>
      loadProducts().then(function () {
        updateBadge();
        renderCart();
      });
    </script>
  </body>
</html>
